title: Talent Agent v2
description: Unified talent dashboard after identity resolution, with structured memory
icon: https://tizzifona.github.io/talent-agent-project/images/icon-heart.png
prefix: talent/v2

scope:
  chat:
    description: Can use generative chat with AI assistant
  useTools:
    description: Can use MCP tools for data processing
  read_memory:
    description: Can query the unified person graph in structured memory
  write_memory:
    description: Can persist matching results to structured memory
  process_data:
    description: Can process CSV data and perform matching
  expertAsk:
    description: Can ask this agent as an MCP expert

grant:
  ${party}:
    - chat
    - useTools
    - read_memory
    - write_memory
    - process_data
    - expertAsk

audience:
  ${party}:
    ${source}: chat useTools read_memory write_memory process_data

tab:
  agent:
    src: agent/main.ts
    importmap: importmap.json
    ttl: 300
    config:
      systemPrompt: |
        You are a talent-data assistant for Blue Hope.
        Help users work with the unified person table after identity resolution.
        Explain match confidence, provenance, and review reasons.
        Canonical records live in structured memory and survive refresh.
        Do not invent employment status.

mcp:
  tab: agent
  path: /rpc
  tools:
    - name: expert_deduplicate
      description: Ask the deduplication expert for analysis and recommendations
      capability: expertAsk
      inputSchema:
        type: object
        properties:
          question:
            type: string
            description: Question about deduplication, matching rules, or data quality
        required: [question]
        additionalProperties: false
      outputSchema:
        type: object
        properties:
          answer:
            type: string
        required: [answer]
        additionalProperties: false
