title: Talent Agent
description: Blue Hope talent dashboard with editable tables and mailing prep
icon: https://tizzifona.github.io/talent-agent-project/images/icon-heart.png
etag: 8

scope:
  chat:
    description: Can use generative chat with AI assistant
  useTools:
    description: Can use MCP tools for data processing
  read_memory:
    description: Can query the unified person graph in structured memory
  write_memory:
    description: Can persist matching results to structured memory
  process_data:
    description: Can process CSV data and perform matching
  expertAsk:
    description: Can ask this agent as an MCP expert
  read_drive:
    description: Can read personal-link replies from drive
  write_drive:
    description: Can manage personal-link replies on drive

grant:
  ${party}:
    - chat
    - useTools
    - read_memory
    - write_memory
    - process_data
    - expertAsk
    - read_drive
    - write_drive

audience:
  ${party}:
    ${source}: chat useTools read_memory write_memory process_data read_drive write_drive

drive:
  replies:
    write:
      - public
      - ${party}
    read:
      - ${party}

tab:
  agent:
    src: agent/main.ts
    importmap: importmap.json
    ttl: 300
    config:
      systemPrompt: |
        You are the on-screen assistant for Blue Hope Talent Agent on a working talent table.
        Help with candidate search, field meaning, review, export, and mailing prep.
        Do not call index_resolve without a search key. Do not invent employment status.

mcp:
  tab: agent
  path: /rpc
  tools:
    - name: expert_deduplicate
      description: Ask the deduplication expert for analysis and recommendations
      capability: expertAsk
      inputSchema:
        type: object
        properties:
          question:
            type: string
            description: Question about deduplication, matching rules, or data quality
        required: [question]
        additionalProperties: false
      outputSchema:
        type: object
        properties:
          answer:
            type: string
        required: [answer]
        additionalProperties: false
